# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  build:
    name: Build Package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia-version: ['1.10']
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3.1.0
      - name: Build and test
        run: |
          julia --project -e 'using Pkg; Pkg.build(); Pkg.test()'
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -czf dist/KnotTheory.jl-${{ matrix.os }}.tar.gz src/ Project.toml README.* LICENSE
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: dist/
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10'
      - name: Generate SBOM
        run: |
          julia --project -e '
            using Pkg, JSON
            pkg_info = Pkg.project()
            deps = Pkg.dependencies()
            sbom = Dict(
              "bomFormat" => "CycloneDX",
              "specVersion" => "1.4",
              "version" => 1,
              "metadata" => Dict(
                "component" => Dict(
                  "type" => "library",
                  "name" => pkg_info.name,
                  "version" => string(pkg_info.version)
                )
              ),
              "components" => [
                Dict(
                  "type" => "library",
                  "name" => string(uuid),
                  "version" => string(info.version)
                ) for (uuid, info) in deps if info.is_direct_dep
              ]
            )
            open("sbom.json", "w") do f
              JSON.print(f, sbom, 2)
            end
          '
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom.json
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, sbom]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts/
      - name: Prepare release
        run: |
          mkdir -p release
          find release-artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: 'release/*'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: KnotTheory.jl ${{ steps.version.outputs.version }}
          body: |
            ## Installation

            ```julia
            using Pkg
            Pkg.add(url="https://github.com/hyperpolymath/KnotTheory.jl", rev="${{ steps.version.outputs.version }}")
            ```

            ## Verification

            ```bash
            sha256sum -c checksums.txt
            ```
          files: release/*
          draft: false
          prerelease: false
