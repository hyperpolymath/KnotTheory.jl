# This workflow is managed by gh actions-lock.
name: GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Checkout casket-ssg
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/casket-ssg
          path: .casket-ssg
      - name: Setup GHCup
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.10'
      - name: Cache Cabal
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            .casket-ssg/dist-newstyle
          key: ${{ runner.os }}-casket-${{ hashFiles('.casket-ssg/casket-ssg.cabal') }}
      - name: Build casket-ssg
        working-directory: .casket-ssg
        run: cabal build
      - name: Prepare site source
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf .site-src _site

          if [ -d site ]; then
            cp -R site .site-src
          else
            mkdir -p .site-src
            TODAY="$(date +%Y-%m-%d)"
            REPO_NAME="${REPO_NAME}"
            REPO_URL="https://github.com/${REPO_FULL_NAME}"
            README_URL=""

            if [ -f README.md ]; then
              README_URL="${REPO_URL}/blob/${BRANCH_NAME}/README.md"
            elif [ -f README.adoc ]; then
              README_URL="${REPO_URL}/blob/${BRANCH_NAME}/README.adoc"
            fi

            {
              echo "---"
              echo "title: ${REPO_NAME}"
              echo "date: ${TODAY}"
              echo "---"
              echo
              echo "# ${REPO_NAME}"
              echo
              echo "Static documentation site for ${REPO_NAME}."
              echo
              echo "- Source repository: [${REPO_FULL_NAME}](${REPO_URL})"
              if [ -n "${README_URL}" ]; then
                echo "- README: [project README](${README_URL})"
              fi
              if [ -d docs ]; then
                echo "- Docs directory: [docs/](${REPO_URL}/tree/${BRANCH_NAME}/docs)"
              fi
              echo
              echo "Project-specific site content can be added later under site/."
            } > .site-src/index.md
          fi
      - name: Build site
        run: |
          mkdir -p _site
          cd .casket-ssg && cabal run casket-ssg -- build ../.site-src ../_site
          touch ../_site/.nojekyll
      - name: Overlay the canonical www bundle
        shell: bash
        run: |
          set -euo pipefail
          # Publish the canonical bundle alongside whatever the SSG produced.
          #
          #   www/public/      -> the servable site root, used as a fallback
          #   www/.well-known/ -> must be reachable at /.well-known/ on this
          #                       origin (RFC 9116, and the RSR check on
          #                       www/.well-known/security.txt)
          #
          # Everything else under www/ (dns/, policies/, profiles/, runbooks/,
          # errors/) is source material and is deliberately NOT published, so
          # only these two subtrees are copied rather than all of www/.
          mkdir -p _site
          # -n (no-clobber): a page the SSG did produce always wins, so the
          # bundle can never regress a working site. It only fills the gaps.
          if [ -d www/public ]; then
            cp -an www/public/. _site/
          fi
          if [ -d www/.well-known ]; then
            mkdir -p _site/.well-known
            cp -a www/.well-known/. _site/.well-known/
          fi
          echo "published tree:"
          find _site -maxdepth 2 | sort
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          include-hidden-files: true
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
