# This workflow is managed by gh actions-lock.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      # KnotTheory depends on the unregistered estate package AcceleratorGate.jl
      # as a path-dep (Manifest: ../AcceleratorGate.jl) — clone it as a sibling.
      - name: Check out sibling estate path-dep
        run: git clone --depth 1 https://github.com/hyperpolymath/AcceleratorGate.jl.git ../AcceleratorGate.jl
      # The committed Manifest.toml is resolved with a specific Julia version, so
      # discard it and re-resolve fresh for this matrix's Julia (1.9/1.10/1.11),
      # devving the path-dep (does not alter Project.toml).
      - name: Install dependencies
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.develop(PackageSpec(path="../AcceleratorGate.jl")); Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
permissions:
  contents: read
